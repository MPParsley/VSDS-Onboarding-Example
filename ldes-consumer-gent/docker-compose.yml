networks:
  ldes-consumer-gent:
    name: ldes-consumer-gent-network

services:

  ### -- Triplestore --

  fuseki:
    image: stain/jena-fuseki:latest
    container_name: fuseki
    ports:
      - "3030:3030"
    networks:
      - ldes-consumer-gent
    environment:
      - ADMIN_PASSWORD=admin
      - JVM_ARGS=-Xmx2g
    volumes:
      - fuseki-data:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ### -- LDES Consumer --

  ldio-workbench:
    image: ldes/ldi-orchestrator:2.12.0
    container_name: ldio-workbench
    environment:
      - SERVER_PORT=80
      - LOGGING_LEVEL_ROOT=INFO
    ports:
      - 9006:80
    networks:
      - ldes-consumer-gent
    depends_on:
      fuseki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://ldio-workbench/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fuseki-data:
