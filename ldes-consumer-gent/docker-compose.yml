networks:
  ldes-consumer-gent:
    name: ldes-consumer-gent-network

services:

  ### -- Triplestore --

  fuseki:
    image: secoresearch/fuseki:latest
    container_name: fuseki
    platform: linux/amd64
    ports:
      - "3031:3030"
    networks:
      - ldes-consumer-gent
    environment:
      - ADMIN_PASSWORD=admin
      - JVM_ARGS=-Xmx2g
      - ENABLE_DATA_WRITE=true
      - ENABLE_UPDATE=true 
      - ENABLE_UPLOAD=true
      - QUERY_TIMEOUT=30000
    volumes:
      - fuseki-data:/fuseki
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3030 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  ### -- RDF4J Server (proxy to Fuseki) --

  rdf4j-server:
    image: eclipse/rdf4j-workbench:latest
    container_name: rdf4j-server
    platform: linux/amd64
    ports:
      - "8080:8080"
    networks:
      - ldes-consumer-gent
    environment:
      - JAVA_OPTS=-Xms1g -Xmx4g
    depends_on:
      fuseki:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/rdf4j-server/repositories || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  ### -- LDES Consumer --

  ldio-workbench:
    image: ldes/ldi-orchestrator:2.14.0
    container_name: ldio-workbench
    environment:
      - SERVER_PORT=80
      - LOGGING_LEVEL_ROOT=INFO
    volumes:
      - ./gent-ldes.crt:/tmp/gent-ldes.crt:ro
      - ./import-cert.sh:/tmp/import-cert.sh:ro
      - ./state:/ldio/lpdc:rw
    entrypoint: ["/bin/sh", "/tmp/import-cert.sh"]
    ports:
      - 9006:80
    networks:
      - ldes-consumer-gent
    depends_on:
      fuseki:
        condition: service_healthy
      rdf4j-server:
        condition: service_healthy
      curl-create-rdf4j-repository:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://ldio-workbench/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  curl-create-rdf4j-repository:
    image: alpine/curl
    container_name: curl-create-rdf4j-repository
    restart: 'no'
    depends_on:
      rdf4j-server:
        condition: "service_healthy"
      fuseki:
        condition: "service_healthy"
    command: |
      curl -X PUT 'http://rdf4j-server:8080/rdf4j-server/repositories/lpdc'
      --header 'Content-Type: text/turtle'
      --data-raw '@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#>.
      @prefix rep: <http://www.openrdf.org/config/repository#>.
      @prefix sparql: <http://www.openrdf.org/config/sparql#>.
      @prefix config: <tag:rdf4j.org,2023:config/>.
      @prefix http: <http://www.w3.org/2011/http#>.

      [] a config:Repository ;
        config:rep.id "lpdc" ;
        rdfs:label "SPARQL endpoint to Fuseki LPDC dataset" ;
        config:rep.impl [
            config:rep.type "openrdf:SPARQLRepository";
            config:sparql.queryEndpoint <http://fuseki:3030/lpdc/sparql>;
            config:sparql.updateEndpoint <http://fuseki:3030/lpdc/update>;
            http:basicAuthentication [
              http:authUser "admin";
              http:authPassword "admin"
            ]
        ].'
    networks:
      - ldes-consumer-gent

volumes:
  fuseki-data:
  ldio-state:
